<!--
Faça uma página na qual existiam quadrados de cores distintas ocupando os quatro cantos da tela com um texto dentro.
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 05 - FDW</title>
</head>
<body>
    <div id="DivMain">

        <div id="DivLeft">
            <div id="DivLeftUp">
                <h1>Bloco 01</h1>
            </div>
            <div id="DivLeftDown">
                <h1>Bloco 02</h1>
            </div>
        </div>
        
        <div id="DivRight">
            <div id="DivRightUp">
                <h1>Bloco 03</h1>
            </div>
            <div id="DivRightDown">
                <h1>Bloco 04</h1>
            </div>
        </div>
    </div>
</body>
</html>

<style>
    html, body {position: fixed; margin: 0; padding: 0; height: 100%; width: 100%; }
    #DivMain { display: flex; position: fixed; height: 100%; width: 100%; align-items: flex-start;}

    #DivLeft, #DivRight { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column;}

    #DivLeftUp, #DivLeftDown, #DivRightUp, #DivRightDown { display: flex; height: 50%; width: 100%; align-items: center; justify-content: center; }

    #DivLeftUp { background-color: red; }
    #DivLeftDown { background-color: blue; }
    #DivRightUp { background-color: yellow; }
    #DivRightDown { background-color: orange; }
</style>
