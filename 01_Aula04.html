<!--
Criar uma tabela com três linhas. A primeira deve possuir três colunas; a segunda, duas; e a terceira, apenas uma

Desafio: fazer a tabela ficar no seguinte formato utilizando o atributo colspan
-->


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula04 - PT2</title>
</head>
<body>
    <table border=2>
        <caption>Explicação Tabela</caption>
        <tr>
            <th colspan="2">Linha 1</th>
            <th colspan="2">Linha 2</th>
            <th colspan="2">Linha 3</th>
        </tr>
        <tr>
            <td colspan="6" style="text-align: center;">Item 1</td>
        </tr>
        <tr>
            <td colspan="3" style="text-align: center;">Item 2</td>
            <td colspan="3" style="text-align: center;">Item 3</td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">Item 4</td>
            <td colspan="2" style="text-align: center;">Item 5</td>
            <td colspan="2" style="text-align: center;">Item 6</td>
        </tr>
    </table>
</body>
</html>
